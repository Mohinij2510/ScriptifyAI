name: ScriptifyAI CD

on:
  workflow_run:
    workflows: ["ScriptifyAI CI"]
    types:
      - completed

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ubuntu/ScriptifyAI

            git pull --ff-only origin main

            cd server

            docker build -t scriptify-backend:latest .

            docker rm -f scriptify-backend || true

            docker run -d \
              --name scriptify-backend \
              --env-file /home/ubuntu/ScriptifyAI/server/.env \
              -p 5000:5000 \
              --restart unless-stopped \
              scriptify-backend:latest

            sleep 5

            docker ps --filter "name=scriptify-backend"

            curl -f http://localhost:5000/api/auth/login || true
