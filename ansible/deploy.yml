---
- name: Deploy Frontend
  hosts: web
  become: yes

  tasks:
    - name: Update packages
      apt:
        update_cache: yes
        upgrade: dist

    - name: Install Docker
      apt:
        name: docker.io
        state: present

    - name: Start Docker
      service:
        name: docker
        state: started
        enabled: yes

    - name: Install Nginx
      apt:
        name: nginx
        state: present

    - name: Copy frontend build
      copy:
        src: ../client/dist/
        dest: /var/www/html/

    - name: Start Nginx
      service:
        name: nginx
        state: started
        enabled: yes
